function placeNear(el,rect,{prefer='right',gap=12,margin=10,left,keepBelow=false}={}){
 popupScrollTop=document.scrollingElement.scrollTop;
 const width=el.offsetWidth,height=el.offsetHeight;
 let x=left??rect.left,y=rect.bottom+gap;
 if(prefer==='right'){
  x=rect.right+gap;y=rect.top;
  if(x+width>innerWidth-margin)x=rect.left-width-gap;
  if(x<margin)x=rect.left;
 }else if(!keepBelow&&y+height>innerHeight-margin){
  if(rect.top-height-gap>=margin)y=rect.top-height-gap;
  else if(rect.right+gap+width<=innerWidth-margin){x=rect.right+gap;y=rect.top}
 }
 x=Math.max(margin,Math.min(x,innerWidth-width-margin));
 y=Math.max(margin,Math.min(y,innerHeight-height-margin));
 Object.assign(el.style,{left:x+'px',top:y+'px'});
}
function sortedSaves(){return Object.entries(library.saves).sort((a,b)=>b[1].updated-a[1].updated)}
function saveProgress(entry){const list=DATA.upgrades.filter(u=>!['auto','unavailable'].includes(u.kind));return `${list.filter(u=>entry.state.done[u.id]===true).length}/${list.length}`}

function deleteSave(id){

function calculate(){
 const totals={},users={};
 for(const u of active())if(!completed(u))for(const[n,k]of Object.entries(u.req)){
  totals[n]=(totals[n]||0)+k;(users[n]??=[]).push({name:u.ko,quantity:k});
 }
 return{totals,users};
}
const TREE_LAYOUT={width:300,height:400,icon:54,inset:50};
function treePoint(node,rowCount){
 return {x:(node.col+.5)*TREE_LAYOUT.width/3,y:TREE_LAYOUT.inset+node.row*(TREE_LAYOUT.height-2*TREE_LAYOUT.inset)/(rowCount-1)};
}
function treeConnections(group,nodes,rowCount){
 const children=new Map(),byId=new Map(nodes.map(u=>[u.id,u]));
 for(const [parent,child] of group.edges){if(!children.has(parent))children.set(parent,[]);children.get(parent).push(child)}
 return [...children].map(([parent,ids])=>{
  const point=treePoint(byId.get(parent),rowCount),targets=ids.map(id=>treePoint(byId.get(id),rowCount));
  const bottom=point.y+TREE_LAYOUT.icon/2,bus=(bottom+Math.min(...targets.map(p=>p.y))-TREE_LAYOUT.icon/2)/2;
  const xs=[point.x,...targets.map(p=>p.x)];
  const path=`M ${point.x} ${bottom} V ${bus} M ${Math.min(...xs)} ${bus} H ${Math.max(...xs)}`+targets.map(p=>` M ${p.x} ${bus} V ${p.y-TREE_LAYOUT.icon/2}`).join('');
  return `<path data-parent="${parent}" d="${path}"/>`;
 }).join('');
}
function renderTrees(){
 $('trees').innerHTML=DATA.groups.map(g=>{
  const nodes=DATA.upgrades.filter(u=>u.group===g.id),rowCount=Math.max(...nodes.map(u=>u.row))+1;
  return `<article class="tree"><div class="tree-title"><h2>${g.name}</h2><span class="tree-count" data-count="${g.id}"></span></div><div class="board" data-board="${g.id}"><svg class="connections" preserveAspectRatio="none" viewBox="0 0 ${TREE_LAYOUT.width} ${TREE_LAYOUT.height}" aria-hidden="true">${treeConnections(g,nodes,rowCount)}</svg>${nodes.map(u=>{
   const point=treePoint(u,rowCount);
   return `<div class="node ${u.kind==='unavailable'?'unavailable':''}" data-node="${u.id}" style="left:${point.x/TREE_LAYOUT.width*100}%;top:${point.y/TREE_LAYOUT.height*100}%;width:${TREE_LAYOUT.icon/TREE_LAYOUT.width*100}%"><button class="icon-button" data-tip="${u.id}" aria-label="${u.ko} (${u.en}) 재료 보기" aria-haspopup="dialog"><img src="${u.icon}" alt="" draggable="false"></button>${u.kind==='unavailable'?'<span class="locked">잠금</span>':`<label class="complete"><input type="checkbox" data-done="${u.id}" aria-label="${u.ko} 완료" ${u.kind==='auto'?'disabled':''}></label>`}</div>`;
  }).join('')}</div></article>`;
 }).join('');
}
function updateTrees(){
 for(const node of $('trees').querySelectorAll('[data-node]')){
  const u=DATA.upgrades.find(u=>u.id===node.dataset.node);
  node.classList.toggle('done',completed(u));
  node.classList.toggle('ready',u.kind!=='unavailable'&&!completed(u)&&isReady(u));
  const input=node.querySelector('input');if(input)input.checked=completed(u);
 }
 const all=active().filter(u=>u.kind!=='auto');
 $('progress').textContent=`${all.filter(completed).length} / ${all.length}`;
 for(const g of DATA.groups){
  const list=all.filter(u=>u.group===g.id);
  document.querySelector(`[data-count="${g.id}"]`).textContent=`${list.filter(completed).length} / ${list.length}`;
 }
}
function renderInventory(){
 $('inventory').innerHTML=names.map(n=>`<div class="material-tile" data-material="${n}">${materialName(n,32)}<div class="material-quantity">${stockStepper(n,true)}<span>/ <span data-total></span></span></div></div>`).join('')+'<div class="empty" id="inventory-empty" hidden></div>';

function updateResults(){
 const{totals}=calculate(),search=$('search').value.trim().toLocaleLowerCase();let visible=0;
 for(const [i,n]of names.entries()){
  const row=$('inventory').querySelector(`[data-material="${n}"]`),total=totals[n]||0,short=Math.max(0,total-have(n)),rank=short?0:total?1:2;
  row.className='material-tile '+(short?'shortage':total?'satisfied':'unneeded');row.style.order=rank*names.length+i;
  row.hidden=(materialFilter==='missing'&&!short)||!`${n} ${DATA.materials[n]}`.toLocaleLowerCase().includes(search);if(!row.hidden)visible++;

  row.querySelector('[data-step="-1"]').disabled=have(n)===0;
 }
 $('material-count').textContent=`${visible}종`;$('inventory-empty').hidden=visible>0;$('inventory-empty').textContent=search?'검색 결과 없음':'부족한 재료 없음';
 updateTrees();if(currentTip)updateTip();if(acquisitionAnchor)updateMaterialUses();

function renderAll(){hideTip();renderTrees();renderInventory();updateResults()}
function materialIcon(n,size=26){const[w,h]=DATA.materialIconSize[n],f=size/Math.max(w,h),s=f>=1?Math.floor(f):f;return `<span class="icon-box" style="width:${size}px;height:${size}px"><img class="material-icon${s<1?' soft':''}" src="${DATA.materialIcons[n]}" width="${Math.round(w*s)}" height="${Math.round(h*s)}" alt="" draggable="false"></span>`}
function materialName(n,size=26){return `<button type="button" class="material-link" data-acquisition="${n}" aria-label="${DATA.materials[n]} 상세 보기" aria-haspopup="dialog" aria-controls="acquisition" aria-expanded="false">${materialIcon(n,size)}<span>${DATA.materials[n]}</span></button>`}
function stockStepper(n,editable=false){return `<div class="stock-stepper"><button type="button" data-adjust-stock="${n}" data-step="-1" aria-label="${DATA.materials[n]} 보유 수량 1개 감소">−</button>${editable?`<input type="number" min="0" step="1" inputmode="numeric" data-stock="${n}" aria-label="${DATA.materials[n]} 보유 수량">`:`<output data-tip-have="${n}" aria-label="${DATA.materials[n]} 보유 수량" aria-live="polite"></output>`}<button type="button" data-adjust-stock="${n}" data-step="1" aria-label="${DATA.materials[n]} 보유 수량 1개 증가">+</button></div>`}
function renderTip(){
 const u=DATA.upgrades.find(u=>u.id===currentTip);
 $('tooltip').innerHTML=`<div class="tip-top"><div><h3>${u.ko}</h3><small>${u.en}</small></div><button class="tip-close" aria-label="재료 상세 닫기">×</button></div>${u.kind==='auto'?'<p class="status">기본 제공</p>':`<div class="tip-materials">${Object.entries(u.req).map(([n,k])=>`<div class="tip-material-row">${materialName(n)}<div class="tip-quantity">${u.kind==='unavailable'?`<span data-tip-have="${n}"></span>`:stockStepper(n)}<span>/ ${k}</span></div></div>`).join('')}</div><p class="status" data-tip-status></p>`}${u.note?`<p class="note">${u.note}</p>`:''}${!['auto','unavailable'].includes(u.kind)?`<label class="tip-complete"><input type="checkbox" data-done="${u.id}">완료</label>`:''}`;

function updateTip(){
 const u=DATA.upgrades.find(u=>u.id===currentTip),tip=$('tooltip');
 for(const el of tip.querySelectorAll('[data-tip-have]')){el.textContent=have(el.dataset.tipHave);el.classList.toggle('short-number',have(el.dataset.tipHave)<u.req[el.dataset.tipHave])}
 for(const button of tip.querySelectorAll('[data-step="-1"]'))button.disabled=have(button.dataset.adjustStock)===0;
 const status=tip.querySelector('[data-tip-status]');
 if(status){status.textContent=u.kind==='unavailable'?'잠긴 업그레이드':completed(u)?'완료':isReady(u)?'재료 충족':'';status.classList.toggle('ready-status',u.kind!=='unavailable'&&!completed(u)&&isReady(u))}
 const input=tip.querySelector('[data-done]');if(input)input.checked=completed(u);

function requirementMarkup(requires,suffix=' 판매'){return requires.map(id=>{const u=DATA.upgrades.find(u=>u.id===id);return `<span data-requires="${id}" class="${completed(u)?'condition-complete':'condition-incomplete'}">${u.ko} 완성 후${suffix}</span>`}).join(' · ')}
function acquisitionGroup(label,body){return `<div class="acquisition-group"><div class="acquisition-label">${label}</div><div class="acquisition-content">${body}</div></div>`}
function acquisitionText(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function updateAcquisitionTitles(){
 for(const row of $('acquisition').querySelectorAll('[data-full-text]')){
  const truncated=[...row.querySelectorAll('.acquisition-who,.acquisition-place,.row-requires')].some(el=>el.scrollWidth>el.clientWidth);
  if(truncated||row.dataset.grouped)row.title=row.dataset.fullText;else row.removeAttribute('title');
 }
}
function updateMaterialUses(){
 const n=acquisitionAnchor.dataset.acquisition,entry=DATA.acquisition[n],{users}=calculate(),rows=entry.rows;
 let body=users[n]?.length?acquisitionGroup('사용',users[n].map(u=>`${u.name} ×${u.quantity}`).join(' · ')):'';
 const vendors=rows.flatMap(r=>r.vendors||[]),conditions=new Map();
 for(const vendor of vendors)for(const id of vendor.requires){if(!conditions.has(id))conditions.set(id,new Set());conditions.get(id).add(vendor.who)}
 for(const row of rows)for(const id of row.requires)if(!conditions.has(id))conditions.set(id,new Set());
 if(conditions.size)body+=acquisitionGroup('조건',[...conditions].map(([id,names])=>{
  const shared=vendors.length&&vendors.every(v=>v.requires.includes(id));
  return `<div>${requirementMarkup([id],shared?' 판매':names.size?' — '+[...names].map(acquisitionText).join(' · '):'')}</div>`;
 }).join(''));
 for(const kind of ['구매','퀘스트','채집','배치','운']){
  if(kind==='운'){
   const group=entry.groups[kind];if(!group)continue;
   body+=acquisitionGroup(kind,`<ul class="acquisition-list"><li data-row-kind="${kind}"><div class="acquisition-row no-who" data-grouped="true" data-full-text="${acquisitionText(group.title)}" title="${acquisitionText(group.title)}"><span class="acquisition-place">${acquisitionText(group.text)}</span></div></li></ul>`);
   continue;
  }
  const list=rows.filter(r=>r.kind===kind);if(!list.length)continue;
  const placement=kind==='배치'?entry.groups[kind]:null;
  body+=acquisitionGroup(kind,`<ul class="acquisition-list ${kind==='구매'?'purchase-list':''}">${list.map(r=>{
   if(kind==='구매'){
    const vendors=r.vendors.map(v=>`<span data-vendor="${acquisitionText(v.who)}" class="${v.requires.every(id=>completed(DATA.upgrades.find(u=>u.id===id)))?'':'vendor-unavailable'}">${acquisitionText(v.who)}</span>`).join(' · ');
    const full=[...new Set(r.vendors.map(v=>[...new Set([v.who,v.where].filter(Boolean))].join(' · ')))].join(' / ');
    return `<li data-row-kind="${kind}"><div class="acquisition-row ${r.wandering?'no-who':''}" data-grouped="true" data-full-text="${acquisitionText(full)}" title="${acquisitionText(full)}"><span class="acquisition-who">${acquisitionText(r.who)}</span><span class="acquisition-place">${r.wandering?acquisitionText(r.where):vendors}</span></div></li>`;
   }
   const full=placement?.title||[...new Set([r.who,r.where].filter(Boolean))].join(' · ');
   return `<li data-row-kind="${kind}"><div class="acquisition-row ${r.who?'':'no-who'}" ${placement?'data-grouped="true"':''} data-full-text="${acquisitionText(full)}"><span class="acquisition-who">${acquisitionText(r.who)}</span><span class="acquisition-place">${acquisitionText(r.where)}</span></div></li>`;
  }).join('')}${placement?.more?`<li><div class="acquisition-row no-who" data-grouped="true" data-full-text="${acquisitionText(placement.title)}"><span class="acquisition-place">외 ${placement.more}곳</span></div></li>`:''}</ul>`);
 }
 $('material-uses').innerHTML=body;if(!$('acquisition').hidden)updateAcquisitionTitles();
}

  if(checked)showCompletion(u,e.target);
  else changeState(u.ko+' 완료 해제',()=>{state.done[u.id]=false});
 }else if(e.target.dataset.stock){
  const input=e.target,n=input.dataset.stock;input.value=q(input.value);
  changeState(DATA.materials[n]+' 수량 변경',()=>{state.stock[n]=q(input.value)},stockBefore.get(input));
  stockBefore.set(input,snapshot());
 }
});
$('inventory').addEventListener('focusin',e=>{if(e.target.dataset.stock)stockBefore.set(e.target,snapshot())});
$('inventory').addEventListener('input',e=>{
 const n=e.target.dataset.stock;if(!n)return;
 state.stock[n]=q(e.target.value);updateResults();
});
$('inventory').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset.stock){e.preventDefault();e.target.dispatchEvent(new Event('change',{bubbles:true}))}});
$('search').addEventListener('input',()=>{hideAcquisition();updateResults()});
for(const b of document.querySelectorAll('[data-filter]'))b.addEventListener('click',()=>{materialFilter=b.dataset.filter;for(const el of document.querySelectorAll('[data-filter]'))el.setAttribute('aria-pressed',el===b);hideAcquisition();updateResults()});
$('save-current').addEventListener('click',()=>{$('save-panel').hidden?openSavePanel():closeSavePanel()});
$('save-panel').addEventListener('click',e=>{
 e.stopPropagation();const button=e.target.closest('button');if(!button)return;
 if(button.dataset.editSave){beginRename(button.dataset.editSave);return}
 if(button.dataset.deleteSave){editingSave=null;deletingSave=button.dataset.deleteSave;renderSavePanel();return}
 if(button.dataset.confirmDelete){deleteSave(button.dataset.confirmDelete);return}
 if(button.hasAttribute('data-cancel-delete')){deletingSave=null;renderSavePanel();return}
 if(button.hasAttribute('data-new-save')){newGame();return}
 if(button.dataset.selectSave)activateSave(button.dataset.selectSave);
});
$('save-panel').addEventListener('keydown',e=>{if(!e.target.dataset.renameSave)return;if(e.key==='Enter'||e.key==='Escape'){e.preventDefault();e.stopPropagation();finishRename(e.key==='Enter')}});
$('reset').addEventListener('click',()=>{closeSavePanel();changeState('초기화',()=>{state={done:{},stock:{}}})});
$('export').addEventListener('click',()=>{
 persistSaves();
 const url=URL.createObjectURL(new Blob([JSON.stringify(library,null,2)],{type:'application/json'}));
 const a=document.createElement('a');a.href=url;a.download='stoneshard-camp-saves.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
});
$('import').addEventListener('click',()=>$('import-file').click());
$('import-file').addEventListener('change',async e=>{
 const f=e.target.files[0];if(!f)return;const raw=JSON.parse(await f.text());e.target.value='';
 const entries=raw.saves?Object.values(raw.saves):[{name:f.name,updated:Date.now(),state:raw,history:[]}];
 for(const entry of entries){const id=saveId(),importedState=JSON.parse(JSON.stringify(entry.state));library.saves[id]={name:importName(entry.name),updated:entry.updated,state:raw.saves?importedState:unifyFaith(importedState),history:copyHistory(entry.history)}}
 persistSaves();if(!$('save-panel').hidden){editingSave=null;deletingSave=null;renderSavePanel()}
});
const TUTORIAL_KEY='stoneshard-camp-tutorial-seen';
const tutorialTexts=[
 '아이콘에 마우스를 올리면 필요한 재료가 나옵니다. 누르면 고정됩니다.',
 '다 지은 시설은 체크합니다. 재료를 보유 수량에서 뺄지 고를 수 있습니다.',
 '창고에 있는 수량을 적습니다. 빨간 줄은 아직 모자란 재료입니다.',
 '재료를 누르면 어디에 쓰이고 어디서 구하는지 나옵니다.',
 '회차마다 세이브를 따로 둘 수 있습니다. 실수는 되돌리기로 취소합니다.'
];
function tutorialTargets(step){
 const first=Array.from($('inventory').querySelectorAll('.material-tile:not([hidden])')).sort((a,b)=>Number(a.style.order)-Number(b.style.order))[0];
 const icon=$('trees').querySelector('[data-tip="workbench"]');
 const targets=[()=>[icon],()=>[icon?.closest('.node').querySelector('[data-done]')],()=>[first?.querySelector('.stock-stepper')],()=>[first?.querySelector('.material-link')],()=>[$('save-current'),$('undo')]];
 return targets[step]().filter(el=>el&&el.getClientRects().length);
}
function tutorialBounds(targets){
 const rects=targets.map(el=>el.getBoundingClientRect());
 return {left:Math.min(...rects.map(r=>r.left)),top:Math.min(...rects.map(r=>r.top)),right:Math.max(...rects.map(r=>r.right)),bottom:Math.max(...rects.map(r=>r.bottom))};
}
function placeTutorial(){
 if(tutorialStep<0)return;
 const targets=tutorialTargets(tutorialStep);if(!targets.length)return;
 const r=tutorialBounds(targets),w=innerWidth,h=innerHeight;
 const left=Math.max(0,r.left-6),top=Math.max(0,r.top-6),right=Math.min(w,r.right+6),bottom=Math.min(h,r.bottom+6);
 const boxes=[[0,0,w,top],[0,top,left,bottom-top],[right,top,w-right,bottom-top],[0,bottom,w,h-bottom]];
 $('tutorial').querySelectorAll('.tutorial-shade').forEach((el,i)=>{const[x,y,width,height]=boxes[i];Object.assign(el.style,{left:x+'px',top:y+'px',width:width+'px',height:height+'px'})});
 Object.assign($('tutorial-highlight').style,{left:left+'px',top:top+'px',width:right-left+'px',height:bottom-top+'px'});
 placeNear($('tutorial-bubble'),{left,top,right,bottom},{prefer:'below',gap:10,margin:12,left:w<=500?16:undefined,keepBelow:w<=500});
}
function showTutorialStep(step,direction=1){
 while(step>=0&&step<5&&!tutorialTargets(step).length)step+=direction;
 if(step<0||step>=5){endTutorial();return}
 tutorialStep=step;$('tutorial').hidden=false;$('tutorial').dataset.step=step+1;
 $('tutorial-step').textContent=`${step+1} / 5`;$('tutorial-text').textContent=tutorialTexts[step];
 $('tutorial').querySelector('[data-tutorial-prev]').disabled=step===0;
 $('tutorial').querySelector('[data-tutorial-next]').textContent=step===4?'닫기':'다음';
 const targets=tutorialTargets(step),r=tutorialBounds(targets);
 if(r.top<6||r.bottom>innerHeight-6)targets[0].scrollIntoView({block:'center',behavior:'instant'});
 placeTutorial();$('tutorial').querySelector('[data-tutorial-next]').focus({preventScroll:true});
}
function startTutorial(){
 if(pendingCompletion)return;
 hideAcquisition();hideTip();closeSavePanel();document.querySelector('main').inert=true;
 showTutorialStep(0);
}
function endTutorial(){
 tutorialStep=-1;$('tutorial').hidden=true;document.querySelector('main').inert=false;
 localStorage.setItem(TUTORIAL_KEY,'1');$('tutorial-start').focus({preventScroll:true});
}
$('tutorial-start').addEventListener('click',startTutorial);
$('tutorial').addEventListener('click',e=>{
 if(e.target.closest('[data-tutorial-next]'))showTutorialStep(tutorialStep+1);
 else if(e.target.closest('[data-tutorial-prev]'))showTutorialStep(tutorialStep-1,-1);
 else if(e.target.closest('[data-tutorial-skip]')||e.target.classList.contains('tutorial-shade')||e.target===$('tutorial'))endTutorial();
});
document.addEventListener('keydown',e=>{
 if(tutorialStep<0)return;
 if(['ArrowRight','ArrowLeft','Escape'].includes(e.key)){
  e.preventDefault();e.stopImmediatePropagation();
  if(e.key==='Escape')endTutorial();else if(e.key==='ArrowRight')showTutorialStep(tutorialStep+1);else if(tutorialStep>0)showTutorialStep(tutorialStep-1,-1);
 }
},true);
window.addEventListener('resize',placeTutorial);window.addEventListener('scroll',()=>{
 const top=document.scrollingElement.scrollTop;
 if(top!==popupScrollTop){hideTip();closeSavePanel()}
 popupScrollTop=top;placeTutorial();
},{passive:true});
persistSaves();updateUndo();renderAll();
if(!localStorage.getItem(TUTORIAL_KEY))startTutorial();
</script>
</body>
</html>
